services:
  - type: web
    name: app-treino-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    dockerCommand: sh -c "npx prisma migrate deploy --schema apps/api/prisma/schema.prisma && npm run start --workspace @app-treino/api"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: app-treino-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: https://edersonprogramador.github.io
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

databases:
  - name: app-treino-db
