name: Deploy API to HostGator (deprecated)

# Substituído por Render + Neon. Mantido apenas para referência histórica.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite DEPLOY para confirmar (legado HostGator)"
        required: true

permissions:
  contents: read

jobs:
  skipped:
    name: Deprecated
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "Este workflow foi descontinuado."
          echo "Use Render (API) + Neon (DB) conforme docs/deploy.md"
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            exit 1
          fi
          exit 1
