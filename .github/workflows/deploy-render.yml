name: Deploy API to Render

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - .github/workflows/deploy-render.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-api
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy API to Render
    runs-on: ubuntu-latest

    steps:
      - name: Check Render secrets
        id: deploy_secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_JWT_SECRET: ${{ secrets.PRODUCTION_JWT_SECRET }}
        shell: bash
        run: |
          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ] && [ -n "$PRODUCTION_DATABASE_URL" ] && [ -n "$PRODUCTION_JWT_SECRET" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Render secrets not fully configured. Deploy skipped."
          fi

      - name: Checkout
        if: steps.deploy_secrets.outputs.available == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.deploy_secrets.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.deploy_secrets.outputs.available == 'true'
        run: npm ci

      - name: Generate Prisma client
        if: steps.deploy_secrets.outputs.available == 'true'
        run: npm run prisma:generate

      - name: Build shared package
        if: steps.deploy_secrets.outputs.available == 'true'
        run: npm run build --workspace @app-treino/shared

      - name: Build API package
        if: steps.deploy_secrets.outputs.available == 'true'
        run: npm run build --workspace @app-treino/api

      - name: Deploy to Render
        if: steps.deploy_secrets.outputs.available == 'true'
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          api-key: ${{ secrets.RENDER_API_KEY }}
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
