name: Deploy API to Koyeb

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile.api
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - "apps/api/**"
      - "packages/shared/**"
      - .github/workflows/deploy-koyeb.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koyeb-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API
    runs-on: ubuntu-latest

    steps:
      - name: Check Koyeb secrets
        id: deploy_secrets
        env:
          KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_JWT_SECRET: ${{ secrets.PRODUCTION_JWT_SECRET }}
        shell: bash
        run: |
          if [ -n "$KOYEB_API_TOKEN" ] && [ -n "$PRODUCTION_DATABASE_URL" ] && [ -n "$PRODUCTION_JWT_SECRET" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Koyeb secrets not fully configured. Deploy skipped."
          fi

      - name: Checkout
        if: steps.deploy_secrets.outputs.available == 'true'
        uses: actions/checkout@v4

      - name: Install and configure Koyeb CLI
        if: steps.deploy_secrets.outputs.available == 'true'
        uses: koyeb-community/koyeb-actions@v2
        with:
          api_token: ${{ secrets.KOYEB_API_TOKEN }}

      - name: Create database secret
        if: steps.deploy_secrets.outputs.available == 'true'
        uses: koyeb/action-git-deploy/secret@v1
        with:
          secret-name: APP_TREINO_DATABASE_URL
          secret-value: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Create JWT secret
        if: steps.deploy_secrets.outputs.available == 'true'
        uses: koyeb/action-git-deploy/secret@v1
        with:
          secret-name: APP_TREINO_JWT_SECRET
          secret-value: ${{ secrets.PRODUCTION_JWT_SECRET }}

      - name: Deploy API from GitHub
        if: steps.deploy_secrets.outputs.available == 'true'
        uses: koyeb/action-git-deploy@v1
        with:
          app-name: app-treino
          service-name: api
          git-url: github.com/${{ github.repository }}
          git-branch: main
          git-sha: ${{ github.sha }}
          git-builder: docker
          git-docker-dockerfile: Dockerfile.api
          git-docker-command: sh -c "npx prisma migrate deploy --schema apps/api/prisma/schema.prisma && npm run start --workspace @app-treino/api"
          service-instance-type: free
          service-regions: was
          service-env: NODE_ENV=production,PORT=3333,DATABASE_URL=@APP_TREINO_DATABASE_URL,JWT_SECRET=@APP_TREINO_JWT_SECRET,WEB_ORIGIN=https://edersonprogramador.github.io
          service-ports: "3333:http"
          service-routes: "/:3333"
          service-checks: "3333:http:/health"
