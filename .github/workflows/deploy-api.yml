name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile.api
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - "apps/api/**"
      - "packages/shared/**"
      - .github/workflows/deploy-api.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-api
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and publish API image
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/api"
          echo "name=$image" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy API to production server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production-api

    steps:
      - name: Check production SSH secrets
        id: deploy_secrets
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_JWT_SECRET: ${{ secrets.PRODUCTION_JWT_SECRET }}
        shell: bash
        run: |
          if [ -n "$PRODUCTION_HOST" ] && [ -n "$PRODUCTION_USER" ] && [ -n "$PRODUCTION_SSH_KEY" ] && [ -n "$PRODUCTION_DATABASE_URL" ] && [ -n "$PRODUCTION_JWT_SECRET" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Production secrets not fully configured. Image was published, deploy skipped."
          fi

      - name: Deploy over SSH
        if: steps.deploy_secrets.outputs.available == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}:latest
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.PRODUCTION_JWT_SECRET }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          WEB_ORIGIN: ${{ vars.PRODUCTION_WEB_ORIGIN }}
          ASAAS_API_KEY: ${{ secrets.PRODUCTION_ASAAS_API_KEY }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.PRODUCTION_ASAAS_WEBHOOK_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ vars.PRODUCTION_GOOGLE_CLIENT_ID }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT }}
          envs: IMAGE,DATABASE_URL,JWT_SECRET,GHCR_USERNAME,GHCR_TOKEN,WEB_ORIGIN,ASAAS_API_KEY,ASAAS_WEBHOOK_TOKEN,GOOGLE_CLIENT_ID
          script: |
            set -e
            mkdir -p ~/app-treino/uploads
            WEB_ORIGIN="${WEB_ORIGIN:-https://edersonprogramador.github.io}"
            if [ -n "$GHCR_USERNAME" ] && [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            fi
            docker pull "$IMAGE"
            docker run --rm \
              -e DATABASE_URL="$DATABASE_URL" \
              "$IMAGE" \
              npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
            docker stop app-treino-api || true
            docker rm app-treino-api || true
            docker run -d \
              --name app-treino-api \
              --restart unless-stopped \
              -p 3333:3333 \
              -e API_PORT=3333 \
              -e DATABASE_URL="$DATABASE_URL" \
              -e JWT_SECRET="$JWT_SECRET" \
              -e WEB_ORIGIN="$WEB_ORIGIN" \
              -e ASAAS_API_KEY="$ASAAS_API_KEY" \
              -e ASAAS_WEBHOOK_TOKEN="$ASAAS_WEBHOOK_TOKEN" \
              -e GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
              -v ~/app-treino/uploads:/app/apps/api/uploads \
              "$IMAGE"
            docker image prune -f
