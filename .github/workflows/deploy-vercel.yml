name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - .github/workflows/deploy-vercel.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-frontend
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy Frontend to Vercel
    runs-on: ubuntu-latest

    steps:
      - name: Check Vercel secrets
        id: deploy_secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Vercel secrets not fully configured. Deploy skipped."
            echo "Configure VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID in repository secrets."
          fi

      - name: Checkout
        if: steps.deploy_secrets.outputs.available == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.deploy_secrets.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.deploy_secrets.outputs.available == 'true'
        run: npm ci

      - name: Build shared package
        if: steps.deploy_secrets.outputs.available == 'true'
        run: npm run build --workspace @app-treino/shared

      - name: Check production API URL
        if: steps.deploy_secrets.outputs.available == 'true'
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        shell: bash
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::VITE_API_URL is required for Vercel deploy."
            echo "Create a repository variable VITE_API_URL with the public HTTPS API URL."
            exit 1
          fi

          if [[ "$VITE_API_URL" == http://localhost* || "$VITE_API_URL" == http://127.0.0.1* ]]; then
            echo "::error::VITE_API_URL cannot point to localhost in production: $VITE_API_URL"
            exit 1
          fi

      - name: Build web app
        if: steps.deploy_secrets.outputs.available == 'true'
        run: npm run build --workspace @app-treino/web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Deploy to Vercel
        if: steps.deploy_secrets.outputs.available == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: ./
