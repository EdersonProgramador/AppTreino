name: Deploy GitHub Pages (deprecated)

# Substituído por Vercel (edersonprogramador.com). Mantido apenas para referência.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite DEPLOY para confirmar (legado Pages)"
        required: true

permissions:
  contents: read

jobs:
  skipped:
    name: Deprecated
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "Este workflow foi descontinuado."
          echo "Use Vercel conforme docs/deploy.md"
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            exit 1
          fi
          exit 1
