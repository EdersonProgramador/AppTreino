<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Live</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #050607; color: #fff; font: 600 14px/1.35 system-ui, sans-serif; }
      #app { position: relative; height: 100%; overflow: hidden; }
      video { width: 100%; height: 100%; object-fit: cover; background: #000; }
      .top {
        position: absolute; left: 12px; right: 12px; top: calc(12px + env(safe-area-inset-top));
        display: flex; align-items: center; justify-content: space-between; gap: 10px; z-index: 3;
      }
      .pill {
        display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px;
        background: rgba(0,0,0,.45); backdrop-filter: blur(8px);
      }
      .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #df663c; box-shadow: 0 0 0 4px rgba(223,102,60,.25); }
      .btn {
        border: 0; border-radius: 999px; padding: 10px 14px; font-weight: 800; cursor: pointer;
        background: rgba(255,255,255,.16); color: #fff;
      }
      .btn.danger { background: #df663c; }
      .chat {
        position: absolute; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
        z-index: 3; display: grid; gap: 8px;
      }
      .msgs {
        max-height: 28vh; overflow: auto; display: grid; gap: 6px; padding-right: 4px;
      }
      .msg {
        align-self: start; max-width: 85%; padding: 8px 10px; border-radius: 14px;
        background: rgba(0,0,0,.42); font-weight: 600;
      }
      .msg strong { display: block; font-size: 11px; opacity: .8; margin-bottom: 2px; }
      .composer { display: flex; gap: 8px; }
      .composer input {
        flex: 1; border: 0; border-radius: 999px; padding: 12px 14px;
        background: rgba(255,255,255,.12); color: #fff; outline: none;
      }
      .error {
        position: absolute; left: 12px; right: 12px; top: 50%; transform: translateY(-50%);
        text-align: center; padding: 16px; background: rgba(120,24,24,.9); border-radius: 16px; z-index: 5;
      }
      .boot {
        position: absolute; inset: 0; display: grid; place-items: center; z-index: 4;
        background: #050607; text-align: center; padding: 24px; gap: 10px;
      }
      .countdown { font-size: 64px; font-weight: 900; }
    </style>
  </head>
  <body>
    <div id="app">
      <video id="video" playsinline autoplay muted></video>
      <div class="top">
        <div class="pill"><span class="live-dot"></span><span id="titleLabel">Live</span></div>
        <button class="btn danger" id="btnEnd" type="button">Encerrar</button>
      </div>
      <div class="chat">
        <div class="msgs" id="msgs"></div>
        <form class="composer" id="chatForm">
          <input id="chatInput" maxlength="280" placeholder="Comentar…" autocomplete="off" />
          <button class="btn" type="submit">Enviar</button>
        </form>
      </div>
      <div class="boot" id="boot"><div class="countdown" id="count">3</div><div>Preparando live…</div></div>
      <div class="error" id="error" hidden></div>
    </div>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const API = (params.get("api") || "").replace(/\/$/, "");
      const TOKEN = params.get("token") || "";
      const MODE = params.get("mode") === "host" ? "host" : "viewer";
      const LIVE_ID = params.get("liveId") || "";
      const TITLE = params.get("title") || "Live";
      const ICE = [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun1.l.google.com:19302" }];

      const video = document.getElementById("video");
      const msgs = document.getElementById("msgs");
      const boot = document.getElementById("boot");
      const countEl = document.getElementById("count");
      const errorEl = document.getElementById("error");
      const titleLabel = document.getElementById("titleLabel");
      const btnEnd = document.getElementById("btnEnd");
      titleLabel.textContent = TITLE;
      if (MODE !== "host") btnEnd.textContent = "Sair";

      let socket = null;
      let pc = null;
      let localStream = null;
      let liveId = LIVE_ID;
      let hostSocketId = null;

      function showError(msg) {
        errorEl.hidden = !msg;
        errorEl.textContent = msg || "";
      }

      function emitNative(payload) {
        try {
          if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(payload));
        } catch (e) {}
      }

      function addMsg(row) {
        const el = document.createElement("div");
        el.className = "msg";
        el.innerHTML = "<strong></strong><span></span>";
        el.querySelector("strong").textContent = row.name || "alguém";
        el.querySelector("span").textContent = row.content || "";
        msgs.appendChild(el);
        msgs.scrollTop = msgs.scrollHeight;
      }

      async function api(path, init) {
        const res = await fetch(API + path, {
          ...init,
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + TOKEN,
            ...(init && init.headers ? init.headers : {})
          }
        });
        if (!res.ok) {
          let message = "Falha na API (" + res.status + ")";
          try {
            const data = await res.json();
            message = data.message || message;
          } catch (e) {}
          throw new Error(message);
        }
        if (res.status === 204) return null;
        return res.json();
      }

      function getSocket() {
        if (socket && socket.connected) return socket;
        socket = io(API, { path: "/socket.io", auth: { token: TOKEN }, transports: ["websocket", "polling"] });
        return socket;
      }

      function cleanup() {
        try { pc && pc.close(); } catch (e) {}
        pc = null;
        if (localStream) localStream.getTracks().forEach((t) => t.stop());
        localStream = null;
        video.srcObject = null;
      }

      async function hostStart() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("Câmera indisponível neste WebView.");
        }
        boot.hidden = false;
        for (let n = 3; n >= 1; n -= 1) {
          countEl.textContent = String(n);
          await new Promise((r) => setTimeout(r, 900));
        }
        countEl.textContent = "AO VIVO";
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 1280 } }
        }).catch(async () => {
          // Fallback for restricted mobile WebViews (e.g. Expo Go).
          return navigator.mediaDevices.getUserMedia({ audio: true, video: true });
        });
        video.srcObject = localStream;
        video.muted = true;
        await video.play().catch(() => undefined);

        if (!liveId) {
          const created = await api("/student/social/live", {
            method: "POST",
            body: JSON.stringify({ title: TITLE })
          });
          liveId = created.live.id;
        }

        const s = getSocket();
        s.emit("live:join", liveId);
        s.on("live:peer-joined", async ({ socketId, isHost }) => {
          if (isHost || !localStream) return;
          try {
            const peer = new RTCPeerConnection({ iceServers: ICE });
            pc = peer;
            localStream.getTracks().forEach((track) => peer.addTrack(track, localStream));
            peer.onicecandidate = (ev) => {
              if (ev.candidate) s.emit("live:signal", { liveId, to: socketId, data: { candidate: ev.candidate } });
            };
            const offer = await peer.createOffer();
            await peer.setLocalDescription(offer);
            s.emit("live:signal", { liveId, to: socketId, data: { sdp: offer } });
          } catch (e) {
            showError("Falha ao conectar espectador.");
          }
        });
        s.on("live:signal", async (payload) => {
          if (!pc || !payload || !payload.data) return;
          try {
            if (payload.data.sdp && payload.data.sdp.type === "answer") {
              await pc.setRemoteDescription(payload.data.sdp);
            } else if (payload.data.candidate) {
              await pc.addIceCandidate(payload.data.candidate).catch(() => undefined);
            }
          } catch (e) {}
        });
        s.on("live:chat", addMsg);
        s.on("live:ended", () => {
          cleanup();
          emitNative({ type: "live-ended" });
        });
        boot.hidden = true;
        emitNative({ type: "live-ready", liveId, mode: "host" });
      }

      async function viewerStart() {
        if (!liveId) throw new Error("Live inválida.");
        boot.hidden = false;
        countEl.textContent = "…";
        const detail = await api("/student/social/live/" + encodeURIComponent(liveId));
        titleLabel.textContent = detail.live.title || TITLE;
        (detail.live.messages || []).forEach(addMsg);
        video.muted = false;

        const s = getSocket();
        await new Promise((resolve, reject) => {
          s.emit("live:join", liveId, async (result) => {
            if (!result || !result.ok) {
              reject(new Error("Live indisponível ou encerrada."));
              return;
            }
            try {
              const peer = new RTCPeerConnection({ iceServers: ICE });
              pc = peer;
              peer.ontrack = (event) => {
                video.srcObject = event.streams[0];
                void video.play().catch(() => undefined);
              };
              peer.onicecandidate = (ev) => {
                if (ev.candidate && hostSocketId) {
                  s.emit("live:signal", { liveId, to: hostSocketId, data: { candidate: ev.candidate } });
                }
              };
              s.on("live:signal", async (payload) => {
                try {
                  if (payload.data && payload.data.sdp && payload.data.sdp.type === "offer") {
                    hostSocketId = payload.from;
                    await peer.setRemoteDescription(payload.data.sdp);
                    const answer = await peer.createAnswer();
                    await peer.setLocalDescription(answer);
                    s.emit("live:signal", { liveId, to: payload.from, data: { sdp: answer } });
                  } else if (payload.data && payload.data.candidate) {
                    await peer.addIceCandidate(payload.data.candidate).catch(() => undefined);
                  }
                } catch (e) {
                  showError("Sinal de vídeo interrompido.");
                }
              });
              resolve();
            } catch (e) {
              reject(e);
            }
          });
        });

        s.on("live:chat", addMsg);
        s.on("live:ended", () => {
          cleanup();
          showError("A live foi encerrada.");
          emitNative({ type: "live-ended" });
        });
        boot.hidden = true;
        emitNative({ type: "live-ready", liveId, mode: "viewer" });
      }

      document.getElementById("chatForm").addEventListener("submit", (event) => {
        event.preventDefault();
        const input = document.getElementById("chatInput");
        const content = String(input.value || "").trim();
        if (!content || !liveId || !socket) return;
        socket.emit("live:chat", { liveId, content });
        input.value = "";
      });

      btnEnd.addEventListener("click", async () => {
        try {
          if (MODE === "host" && liveId) {
            getSocket().emit("live:end", liveId);
            await api("/student/social/live/" + encodeURIComponent(liveId) + "/end", { method: "POST", body: "{}" });
          }
        } catch (e) {}
        cleanup();
        emitNative({ type: "live-closed" });
      });

      (async () => {
        try {
          if (!API || !TOKEN) throw new Error("Sessão inválida para a live.");
          if (MODE === "host") await hostStart();
          else await viewerStart();
        } catch (err) {
          boot.hidden = true;
          showError(err && err.message ? err.message : "Falha ao abrir a live.");
          emitNative({ type: "live-error", message: err && err.message ? err.message : "Falha" });
        }
      })();
    </script>
  </body>
</html>
