<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Mapa de atividade</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <style>
      html, body, #map { margin: 0; height: 100%; width: 100%; background: #0b1a12; }
      .maplibregl-ctrl-attrib { font-size: 10px; }
      .fab-stack {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-30%);
        display: grid;
        gap: 10px;
        z-index: 4;
      }
      .fab, .fab-3d {
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 50%;
        background: #fff;
        color: #15100b;
        box-shadow: 0 8px 18px rgba(0,0,0,.28);
        font-weight: 800;
        cursor: pointer;
        position: relative;
      }
      .fab-3d { font-size: 12px; letter-spacing: .04em; }
      .fab.active, .fab-3d.active { background: #f2b461; color: #1a1208; }
      .badge {
        position: absolute;
        top: -4px;
        right: -4px;
        min-width: 18px;
        height: 18px;
        border-radius: 999px;
        background: #df663c;
        color: #fff;
        font-size: 10px;
        font-weight: 800;
        display: none;
        place-items: center;
        padding: 0 4px;
      }
      .badge.is-on { display: grid; }
      #map.is-picking { cursor: crosshair; }
      .pick-banner {
        display: none;
        position: absolute;
        left: 12px;
        right: 68px;
        top: 12px;
        z-index: 5;
        background: rgba(21, 16, 11, 0.92);
        color: #fff;
        border-radius: 14px;
        padding: 10px 12px;
        font: 700 13px/1.35 system-ui, sans-serif;
        box-shadow: 0 10px 24px rgba(0,0,0,.28);
      }
      .pick-banner.is-on { display: block; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div class="pick-banner" id="pickBanner">Toque no mapa para marcar o ponto de partida da volta</div>
    <div class="fab-stack" id="fabs">
      <button class="fab" id="layersBtn" type="button" title="Camadas" aria-label="Camadas">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
        <span class="badge" id="layerBadge">0</span>
      </button>
      <button class="fab-3d" id="btn3d" type="button" aria-label="Mapa 3D">3D</button>
      <button class="fab" id="locateBtn" type="button" title="Minha localização" aria-label="Centralizar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
    </div>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script>
      const VECTOR_STYLES = {
        standard: "https://tiles.openfreemap.org/styles/liberty",
        winter: "https://tiles.openfreemap.org/styles/positron",
        night: "https://tiles.openfreemap.org/styles/dark"
      };
      const RASTER = {
        satellite: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
        labels: ["https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}"],
        bike: ["https://a.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png"],
        topo: ["https://a.tile.opentopomap.org/{z}/{x}/{y}.png"],
        hill: ["https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}"]
      };
      const TERRARIUM_TILES = ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"];

      const state = {
        mapType: "standard",
        activityMap: "personal",
        layers: { pois: true, bikeLanes: false, avalanche: false, slope: false, aspect: false },
        is3d: false,
        follow: true,
        pickMode: false,
        maptilerKey: "",
        track: [],
        heatTracks: [],
        heatCells: [],
        live: null,
        lapMarker: null,
        laps: [],
        userInteracting: false
      };

      let overlayReady = false;

      function emit(msg) {
        try {
          if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(msg));
          else if (window.parent && window.parent !== window) window.parent.postMessage(msg, "*");
        } catch (e) {}
      }

      function emptyLine() {
        return { type: "Feature", geometry: { type: "LineString", coordinates: [] }, properties: {} };
      }
      function emptyMulti() {
        return { type: "FeatureCollection", features: [] };
      }
      function emptyPoint() {
        return { type: "Feature", geometry: { type: "Point", coordinates: [0, 0] }, properties: { hidden: true } };
      }

      function resolveVectorStyle() {
        if (state.activityMap === "night" || state.mapType === "winter") {
          return state.activityMap === "night" ? VECTOR_STYLES.night : VECTOR_STYLES.winter;
        }
        return VECTOR_STYLES.standard;
      }

      function isSatelliteMode() {
        return state.mapType === "satellite" || state.mapType === "hybrid";
      }

      function buildSatelliteStyle() {
        const sources = {
          sat: { type: "raster", tiles: RASTER.satellite, tileSize: 256, attribution: "© Esri" }
        };
        const layers = [{ id: "sat", type: "raster", source: "sat" }];
        if (state.mapType === "hybrid" || state.layers.pois) {
          sources.labels = { type: "raster", tiles: RASTER.labels, tileSize: 256, attribution: "© Esri" };
          layers.push({ id: "labels", type: "raster", source: "labels", paint: { "raster-opacity": 0.95 } });
        }
        return { version: 8, sources, layers, glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf" };
      }

      const map = new maplibregl.Map({
        container: "map",
        style: resolveVectorStyle(),
        center: [-46.63, -23.55],
        zoom: 14,
        pitch: 0,
        maxPitch: 85,
        attributionControl: true
      });

      function ensureSource(id, data) {
        if (map.getSource(id)) return map.getSource(id);
        map.addSource(id, { type: "geojson", data: data || emptyMulti() });
        return map.getSource(id);
      }

      function ensureRasterOverlay(id, tiles, opacity) {
        if (!map.getSource(id)) {
          map.addSource(id, { type: "raster", tiles, tileSize: 256, attribution: "© OSM © Esri" });
        }
        if (!map.getLayer(id)) {
          map.addLayer({
            id,
            type: "raster",
            source: id,
            paint: { "raster-opacity": opacity == null ? 0.6 : opacity }
          });
        } else {
          map.setPaintProperty(id, "raster-opacity", opacity == null ? 0.6 : opacity);
        }
      }

      function removeLayerSafe(id) {
        if (map.getLayer(id)) map.removeLayer(id);
      }

      function removeSourceSafe(id) {
        if (map.getSource(id)) map.removeSource(id);
      }

      function findBeforeId() {
        const layers = map.getStyle().layers || [];
        const label = layers.find((l) => /label|place|poi|housenumber|road.*name/i.test(l.id));
        return label ? label.id : undefined;
      }

      function addOverlayLayers() {
        overlayReady = false;
        ensureSource("track", emptyLine());
        ensureSource("heat", emptyMulti());
        ensureSource("heatCells", emptyMulti());
        ensureSource("live", emptyPoint());
        ensureSource("lapZone", emptyMulti());
        ensureSource("laps", emptyMulti());

        const night = state.activityMap === "night";
        const before = findBeforeId();

        const add = (layer) => {
          if (map.getLayer(layer.id)) return;
          if (before) map.addLayer(layer, before);
          else map.addLayer(layer);
        };

        add({
          id: "heat",
          type: "line",
          source: "heat",
          paint: {
            "line-color": night ? "#7ee0ff" : "#3d9bff",
            "line-width": 3,
            "line-opacity": 0.45
          }
        });
        add({
          id: "heat-cells",
          type: "circle",
          source: "heatCells",
          paint: {
            "circle-radius": ["interpolate", ["linear"], ["get", "weight"], 0, 8, 5000, 18, 20000, 28],
            "circle-color": night ? "#7ee0ff" : "#ff7a3d",
            "circle-opacity": 0.28,
            "circle-blur": 0.55
          }
        });
        add({
          id: "track-glow",
          type: "line",
          source: "track",
          paint: { "line-color": "#7ee0ff", "line-width": 10, "line-opacity": 0.28 }
        });
        add({
          id: "track",
          type: "line",
          source: "track",
          paint: { "line-color": "#2f7dff", "line-width": 4, "line-opacity": 0.95 }
        });
        add({
          id: "lap-zone",
          type: "fill",
          source: "lapZone",
          paint: { "fill-color": "#df663c", "fill-opacity": 0.18 },
          filter: ["==", ["geometry-type"], "Polygon"]
        });
        add({
          id: "lap-zone-line",
          type: "line",
          source: "lapZone",
          paint: { "line-color": "#df663c", "line-width": 2, "line-opacity": 0.9 },
          filter: ["==", ["geometry-type"], "Polygon"]
        });
        add({
          id: "lap-start",
          type: "circle",
          source: "lapZone",
          paint: {
            "circle-radius": 9,
            "circle-color": "#df663c",
            "circle-stroke-width": 3,
            "circle-stroke-color": "#fff"
          },
          filter: ["==", ["geometry-type"], "Point"]
        });
        add({
          id: "laps",
          type: "circle",
          source: "laps",
          paint: {
            "circle-radius": 7,
            "circle-color": "#f2b461",
            "circle-stroke-width": 2,
            "circle-stroke-color": "#fff"
          }
        });
        add({
          id: "live",
          type: "circle",
          source: "live",
          paint: {
            "circle-radius": 8,
            "circle-color": "#2f7dff",
            "circle-stroke-width": 4,
            "circle-stroke-color": "#fff"
          },
          filter: ["!=", ["get", "hidden"], true]
        });

        applyRasterLayers();
        apply3dWorld();
        restoreOverlayData();
        overlayReady = true;
        updateLayerBadge();
      }

      function applyRasterLayers() {
        ["bike", "topo", "hill"].forEach((id) => {
          removeLayerSafe(id);
          removeSourceSafe(id);
        });
        if (state.layers.bikeLanes) ensureRasterOverlay("bike", RASTER.bike, 0.72);
        if (state.layers.slope || state.layers.avalanche) {
          ensureRasterOverlay("topo", RASTER.topo, state.layers.avalanche ? 0.7 : 0.55);
        }
        if (state.layers.aspect) ensureRasterOverlay("hill", RASTER.hill, 0.5);
      }

      function terrainSourceSpec() {
        if (state.maptilerKey) {
          return {
            type: "raster-dem",
            url: "https://api.maptiler.com/tiles/terrain-rgb-v2/tiles.json?key=" + encodeURIComponent(state.maptilerKey),
            tileSize: 256
          };
        }
        return {
          type: "raster-dem",
          tiles: TERRARIUM_TILES,
          encoding: "terrarium",
          tileSize: 256,
          maxzoom: 15,
          attribution: "© Mapzen / AWS Terrain"
        };
      }

      function findBuildingSource() {
        const style = map.getStyle();
        if (!style || !style.sources) return null;
        for (const [id, src] of Object.entries(style.sources)) {
          if (src.type !== "vector") continue;
          const probe = (style.layers || []).find(
            (l) => l.source === id && (l["source-layer"] === "building" || /building/i.test(l.id))
          );
          if (probe) return { source: id, sourceLayer: probe["source-layer"] || "building" };
          if (/openmaptiles|protomaps|omv/i.test(id)) return { source: id, sourceLayer: "building" };
        }
        return null;
      }

      function apply3dWorld() {
        removeLayerSafe("3d-buildings");
        if (map.getSource("terrain-dem")) {
          try { map.setTerrain(null); } catch (e) {}
          removeSourceSafe("terrain-dem");
        }

        document.getElementById("btn3d").classList.toggle("active", state.is3d);

        if (!state.is3d) {
          map.easeTo({ pitch: 0, bearing: 0, duration: 450 });
          return;
        }

        if (!isSatelliteMode()) {
          try {
            map.addSource("terrain-dem", terrainSourceSpec());
            map.setTerrain({ source: "terrain-dem", exaggeration: 1.15 });
          } catch (e) {}

          const building = findBuildingSource();
          if (building) {
            try {
              map.addLayer({
                id: "3d-buildings",
                source: building.source,
                "source-layer": building.sourceLayer,
                type: "fill-extrusion",
                minzoom: 14,
                filter: ["!=", ["get", "hide_3d"], true],
                paint: {
                  "fill-extrusion-color": state.activityMap === "night" ? "#3a4558" : "#c8c4bc",
                  "fill-extrusion-height": [
                    "interpolate", ["linear"], ["zoom"],
                    14, 0,
                    14.5, ["coalesce", ["get", "render_height"], ["get", "height"], 8]
                  ],
                  "fill-extrusion-base": ["coalesce", ["get", "render_min_height"], ["get", "min_height"], 0],
                  "fill-extrusion-opacity": 0.82
                }
              });
            } catch (e) {}
          }
        }

        map.easeTo({ pitch: 60, bearing: -18, duration: 500 });
      }

      function restoreOverlayData() {
        if (state.track.length) setTrack(state.track, false);
        setHeat(state.heatTracks, state.heatCells);
        if (state.live) setLive(state.live.lat, state.live.lng, false);
        setLapMarker(state.lapMarker);
        setLaps(state.laps);
      }

      function refreshBaseStyle() {
        const center = map.getCenter();
        const zoom = map.getZoom();
        const bearing = map.getBearing();
        const pitch = map.getPitch();
        overlayReady = false;
        const nextStyle = isSatelliteMode() ? buildSatelliteStyle() : resolveVectorStyle();
        map.setStyle(nextStyle);
        map.once("styledata", () => {
          map.jumpTo({ center, zoom, bearing, pitch });
          // wait until style fully ready for vector sources
          const finish = () => {
            if (!map.isStyleLoaded()) {
              map.once("idle", finish);
              return;
            }
            addOverlayLayers();
          };
          finish();
        });
      }

      function setTrack(points, fit) {
        state.track = points || [];
        const coords = state.track.map((p) => [p.lng, p.lat]);
        const src = map.getSource("track");
        if (src) src.setData({ type: "Feature", geometry: { type: "LineString", coordinates: coords }, properties: {} });
        if (fit && coords.length > 1) {
          const bounds = coords.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0]));
          map.fitBounds(bounds, { padding: 48, maxZoom: 16, duration: 400, pitch: state.is3d ? 60 : map.getPitch() });
        }
      }

      function setHeat(tracks, cells) {
        state.heatTracks = tracks || [];
        state.heatCells = cells || [];
        const src = map.getSource("heat");
        if (src) {
          src.setData({
            type: "FeatureCollection",
            features: state.heatTracks
              .filter((t) => t && t.length > 1)
              .map((t) => ({
                type: "Feature",
                geometry: { type: "LineString", coordinates: t.map((p) => [p.lng, p.lat]) },
                properties: {}
              }))
          });
        }
        const cellSrc = map.getSource("heatCells");
        if (cellSrc) {
          cellSrc.setData({
            type: "FeatureCollection",
            features: state.heatCells
              .filter((c) => c && Number.isFinite(c.lat) && Number.isFinite(c.lng))
              .map((c) => ({
                type: "Feature",
                geometry: { type: "Point", coordinates: [c.lng, c.lat] },
                properties: { weight: Number(c.weight) || 1, activities: Number(c.activities) || 1 }
              }))
          });
        }
      }

      function setLive(lat, lng, follow) {
        state.live = { lat, lng };
        const src = map.getSource("live");
        if (src) {
          src.setData({
            type: "Feature",
            geometry: { type: "Point", coordinates: [lng, lat] },
            properties: {}
          });
        }
        const shouldFollow = follow !== false && state.follow && !state.userInteracting;
        if (shouldFollow) {
          map.easeTo({
            center: [lng, lat],
            duration: 280,
            pitch: state.is3d ? 60 : map.getPitch()
          });
        }
      }

      function circlePolygon(lng, lat, radiusM) {
        const coords = [];
        const steps = 64;
        for (let i = 0; i <= steps; i += 1) {
          const angle = (i / steps) * Math.PI * 2;
          const dx = (radiusM * Math.cos(angle)) / (111320 * Math.cos((lat * Math.PI) / 180));
          const dy = (radiusM * Math.sin(angle)) / 110540;
          coords.push([lng + dx, lat + dy]);
        }
        return { type: "Polygon", coordinates: [coords] };
      }

      function setLapMarker(marker) {
        state.lapMarker = marker || null;
        const src = map.getSource("lapZone");
        if (!src) return;
        if (!marker || !marker.lat || !marker.lng) {
          src.setData({ type: "FeatureCollection", features: [] });
          return;
        }
        src.setData({
          type: "FeatureCollection",
          features: [
            {
              type: "Feature",
              geometry: circlePolygon(marker.lng, marker.lat, marker.radiusMeters || 22),
              properties: {}
            },
            {
              type: "Feature",
              geometry: { type: "Point", coordinates: [marker.lng, marker.lat] },
              properties: {}
            }
          ]
        });
      }

      function setLaps(laps) {
        state.laps = laps || [];
        const src = map.getSource("laps");
        if (!src) return;
        src.setData({
          type: "FeatureCollection",
          features: state.laps.map((lap, index) => ({
            type: "Feature",
            geometry: { type: "Point", coordinates: [lap.lng, lap.lat] },
            properties: { n: index + 1 }
          }))
        });
      }

      function setPickMode(on) {
        state.pickMode = Boolean(on);
        document.getElementById("map").classList.toggle("is-picking", state.pickMode);
        document.getElementById("pickBanner").classList.toggle("is-on", state.pickMode);
        map.getCanvas().style.cursor = state.pickMode ? "crosshair" : "";
      }

      function extraLayerCount() {
        const l = state.layers;
        return ["bikeLanes", "avalanche", "slope", "aspect"].filter((k) => l[k]).length;
      }

      function updateLayerBadge() {
        const n = extraLayerCount();
        const badge = document.getElementById("layerBadge");
        badge.textContent = String(n);
        badge.classList.toggle("is-on", n > 0);
      }

      window.applyMapCommand = function applyMapCommand(raw) {
        const msg = typeof raw === "string" ? JSON.parse(raw) : raw;
        if (!msg || !msg.type) return;
        if (msg.type === "setConfig") {
          state.maptilerKey = String(msg.maptilerKey || "");
          if (state.is3d) apply3dWorld();
        }
        if (msg.type === "init" || msg.type === "setView") {
          if (msg.lat && msg.lng) {
            state.userInteracting = false;
            map.jumpTo({ center: [msg.lng, msg.lat], zoom: msg.zoom || 15, pitch: state.is3d ? 60 : map.getPitch() });
          }
        }
        if (msg.type === "setFollow") {
          state.follow = msg.on !== false;
          if (state.follow) state.userInteracting = false;
        }
        if (msg.type === "setTrack") setTrack(msg.points || [], Boolean(msg.fit));
        if (msg.type === "setHeat") setHeat(msg.tracks || [], msg.cells || []);
        if (msg.type === "setLive" && msg.lat && msg.lng) setLive(msg.lat, msg.lng, msg.follow);
        if (msg.type === "setMapType") {
          state.mapType = msg.mapType || "standard";
          refreshBaseStyle();
        }
        if (msg.type === "setActivityMap") {
          state.activityMap = msg.mode || "personal";
          refreshBaseStyle();
        }
        if (msg.type === "setLayers") {
          state.layers = Object.assign(state.layers, msg.layers || {});
          updateLayerBadge();
          if (overlayReady) {
            applyRasterLayers();
            if (isSatelliteMode()) refreshBaseStyle();
          }
        }
        if (msg.type === "set3d") {
          state.is3d = Boolean(msg.on);
          apply3dWorld();
        }
        if (msg.type === "showControls") {
          document.getElementById("fabs").style.display = msg.on === false ? "none" : "grid";
        }
        if (msg.type === "locate") emit({ type: "locate-request" });
        if (msg.type === "setLapMarker") setLapMarker(msg.marker || null);
        if (msg.type === "setLaps") setLaps(msg.laps || []);
        if (msg.type === "setPickMode") setPickMode(msg.on);
      };

      function onMsg(ev) {
        const data = ev && ev.data;
        if (!data) return;
        try {
          window.applyMapCommand(typeof data === "string" && data[0] === "{" ? JSON.parse(data) : data);
        } catch (e) {}
      }
      window.addEventListener("message", onMsg);
      document.addEventListener("message", onMsg);

      document.getElementById("layersBtn").onclick = () => emit({ type: "open-layers" });
      document.getElementById("btn3d").onclick = () => {
        state.is3d = !state.is3d;
        apply3dWorld();
        emit({ type: "toggle-3d", on: state.is3d });
      };
      document.getElementById("locateBtn").onclick = () => {
        state.follow = true;
        state.userInteracting = false;
        emit({ type: "locate-request" });
      };

      map.on("dragstart", () => {
        state.userInteracting = true;
        emit({ type: "user-pan" });
      });
      map.on("click", (event) => {
        if (!state.pickMode) return;
        const { lng, lat } = event.lngLat;
        emit({ type: "map-pick", kind: "lap-start", lat, lng });
        setPickMode(false);
      });

      map.on("load", () => {
        addOverlayLayers();
        emit({ type: "ready" });
      });
    </script>
  </body>
</html>
