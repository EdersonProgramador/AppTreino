<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Mapa de atividade</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <style>
      html, body, #map { margin: 0; height: 100%; width: 100%; background: #0b1a12; }
      .maplibregl-ctrl-attrib { font-size: 10px; }
      .fab-stack {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-30%);
        display: grid;
        gap: 10px;
        z-index: 4;
      }
      .fab, .fab-3d {
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 50%;
        background: #fff;
        color: #15100b;
        box-shadow: 0 8px 18px rgba(0,0,0,.28);
        font-weight: 800;
        cursor: pointer;
        position: relative;
      }
      .fab-3d { font-size: 12px; letter-spacing: .04em; }
      .fab.active, .fab-3d.active { background: #f2b461; color: #1a1208; }
      .badge {
        position: absolute;
        top: -4px;
        right: -4px;
        min-width: 18px;
        height: 18px;
        border-radius: 999px;
        background: #df663c;
        color: #fff;
        font-size: 10px;
        font-weight: 800;
        display: grid;
        place-items: center;
        padding: 0 4px;
      }
      #map.is-picking { cursor: crosshair; }
      .pick-banner {
        display: none;
        position: absolute;
        left: 12px;
        right: 68px;
        top: 12px;
        z-index: 5;
        background: rgba(21, 16, 11, 0.92);
        color: #fff;
        border-radius: 14px;
        padding: 10px 12px;
        font: 700 13px/1.35 system-ui, sans-serif;
        box-shadow: 0 10px 24px rgba(0,0,0,.28);
      }
      .pick-banner.is-on { display: block; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div class="pick-banner" id="pickBanner">Toque no mapa para marcar o ponto de partida da volta</div>
    <div class="fab-stack" id="fabs">
      <button class="fab" id="layersBtn" type="button" title="Camadas" aria-label="Camadas">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
        <span class="badge" id="layerBadge">6</span>
      </button>
      <button class="fab-3d" id="btn3d" type="button" aria-label="Mapa 3D">3D</button>
      <button class="fab" id="locateBtn" type="button" title="Minha localização" aria-label="Centralizar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
    </div>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script>
      const TILES = {
        standard: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
        satellite: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
        winter: ["https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png"],
        night: ["https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png"],
        labels: ["https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}"],
        bike: ["https://a.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png"],
        topo: ["https://a.tile.opentopomap.org/{z}/{x}/{y}.png"],
        hill: ["https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}"]
      };

      const state = {
        mapType: "standard",
        activityMap: "personal",
        layers: { pois: true, bikeLanes: false, avalanche: false, slope: false, aspect: false },
        is3d: false,
        showControls: true,
        pickMode: false,
        lapMarker: null,
        laps: []
      };

      function emit(msg) {
        try {
          if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(msg));
          else if (window.parent && window.parent !== window) window.parent.postMessage(msg, "*");
        } catch (e) {}
      }

      function raster(id, tiles, opacity) {
        return {
          id,
          tiles,
          opacity: opacity == null ? 1 : opacity
        };
      }

      function buildStyle() {
        const night = state.activityMap === "night";
        const winter = state.mapType === "winter" || night;
        const sat = state.mapType === "satellite" || state.mapType === "hybrid";
        const sources = {};
        const layers = [];
        const add = (id, tiles, opacity) => {
          sources[id] = { type: "raster", tiles, tileSize: 256, attribution: "© OSM © Esri" };
          layers.push({ id, type: "raster", source: id, paint: { "raster-opacity": opacity == null ? 1 : opacity } });
        };
        if (sat) add("sat", TILES.satellite, 1);
        else if (winter) add("winter", TILES.winter, 1);
        else add("osm", TILES.standard, 1);
        if (state.mapType === "hybrid" || state.layers.pois) add("labels", TILES.labels, 0.95);
        if (state.layers.bikeLanes) add("bike", TILES.bike, 0.72);
        if (state.layers.slope || state.layers.avalanche) add("topo", TILES.topo, state.layers.avalanche ? 0.7 : 0.55);
        if (state.layers.aspect) add("hill", TILES.hill, 0.5);
        sources.track = { type: "geojson", data: emptyLine() };
        sources.heat = { type: "geojson", data: emptyMulti() };
        sources.heatCells = { type: "geojson", data: emptyMulti() };
        sources.live = { type: "geojson", data: emptyPoint() };
        sources.lapZone = { type: "geojson", data: emptyMulti() };
        sources.laps = { type: "geojson", data: emptyMulti() };
        layers.push(
          {
            id: "heat",
            type: "line",
            source: "heat",
            paint: {
              "line-color": night ? "#7ee0ff" : "#3d9bff",
              "line-width": 3,
              "line-opacity": 0.45
            }
          },
          {
            id: "heat-cells",
            type: "circle",
            source: "heatCells",
            paint: {
              "circle-radius": [
                "interpolate", ["linear"], ["get", "weight"],
                0, 8,
                5000, 18,
                20000, 28
              ],
              "circle-color": night ? "#7ee0ff" : "#ff7a3d",
              "circle-opacity": 0.28,
              "circle-blur": 0.55
            }
          },
          {
            id: "track-glow",
            type: "line",
            source: "track",
            paint: { "line-color": "#7ee0ff", "line-width": 10, "line-opacity": 0.28 }
          },
          {
            id: "track",
            type: "line",
            source: "track",
            paint: { "line-color": "#2f7dff", "line-width": 4, "line-opacity": 0.95 }
          },
          {
            id: "lap-zone",
            type: "fill",
            source: "lapZone",
            paint: { "fill-color": "#df663c", "fill-opacity": 0.18 },
            filter: ["==", ["geometry-type"], "Polygon"]
          },
          {
            id: "lap-zone-line",
            type: "line",
            source: "lapZone",
            paint: { "line-color": "#df663c", "line-width": 2, "line-opacity": 0.9 },
            filter: ["==", ["geometry-type"], "Polygon"]
          },
          {
            id: "lap-start",
            type: "circle",
            source: "lapZone",
            paint: {
              "circle-radius": 9,
              "circle-color": "#df663c",
              "circle-stroke-width": 3,
              "circle-stroke-color": "#fff"
            },
            filter: ["==", ["geometry-type"], "Point"]
          },
          {
            id: "laps",
            type: "circle",
            source: "laps",
            paint: {
              "circle-radius": 7,
              "circle-color": "#f2b461",
              "circle-stroke-width": 2,
              "circle-stroke-color": "#fff"
            }
          },
          {
            id: "live",
            type: "circle",
            source: "live",
            paint: {
              "circle-radius": 8,
              "circle-color": "#2f7dff",
              "circle-stroke-width": 4,
              "circle-stroke-color": "#fff"
            }
          }
        );
        return { version: 8, sources, layers };
      }

      function emptyLine() {
        return { type: "Feature", geometry: { type: "LineString", coordinates: [] }, properties: {} };
      }
      function emptyMulti() {
        return { type: "FeatureCollection", features: [] };
      }
      function emptyPoint() {
        return { type: "Feature", geometry: { type: "Point", coordinates: [0, 0] }, properties: { hidden: true } };
      }

      const map = new maplibregl.Map({
        container: "map",
        style: buildStyle(),
        center: [-46.63, -23.55],
        zoom: 14,
        pitch: 0,
        attributionControl: true
      });

      function apply3d() {
        map.easeTo({ pitch: state.is3d ? 60 : 0, bearing: state.is3d ? -18 : 0, duration: 500 });
        document.getElementById("btn3d").classList.toggle("active", state.is3d);
      }

      function refreshStyle() {
        const center = map.getCenter();
        const zoom = map.getZoom();
        const bearing = map.getBearing();
        const pitch = map.getPitch();
        map.setStyle(buildStyle());
        map.once("styledata", () => {
          map.jumpTo({ center, zoom, bearing, pitch });
          if (state.lapMarker) setLapMarker(state.lapMarker);
          if (state.laps && state.laps.length) setLaps(state.laps);
        });
      }

      function setTrack(points) {
        const coords = (points || []).map((p) => [p.lng, p.lat]);
        const src = map.getSource("track");
        if (src) src.setData({ type: "Feature", geometry: { type: "LineString", coordinates: coords }, properties: {} });
        if (coords.length > 1) {
          const bounds = coords.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0]));
          map.fitBounds(bounds, { padding: 48, maxZoom: 16, duration: 400, pitch: state.is3d ? 60 : 0 });
        }
      }

      function setHeat(tracks, cells) {
        const src = map.getSource("heat");
        if (src) {
          src.setData({
            type: "FeatureCollection",
            features: (tracks || [])
              .filter((t) => t && t.length > 1)
              .map((t) => ({
                type: "Feature",
                geometry: { type: "LineString", coordinates: t.map((p) => [p.lng, p.lat]) },
                properties: {}
              }))
          });
        }
        const cellSrc = map.getSource("heatCells");
        if (cellSrc) {
          cellSrc.setData({
            type: "FeatureCollection",
            features: (cells || [])
              .filter((c) => c && Number.isFinite(c.lat) && Number.isFinite(c.lng))
              .map((c) => ({
                type: "Feature",
                geometry: { type: "Point", coordinates: [c.lng, c.lat] },
                properties: { weight: Number(c.weight) || 1, activities: Number(c.activities) || 1 }
              }))
          });
        }
      }

      function setLive(lat, lng) {
        const src = map.getSource("live");
        if (src) src.setData({ type: "Feature", geometry: { type: "Point", coordinates: [lng, lat] }, properties: {} });
        map.easeTo({ center: [lng, lat], duration: 250, pitch: state.is3d ? 60 : map.getPitch() });
      }

      function circlePolygon(lng, lat, radiusM) {
        const coords = [];
        const steps = 64;
        for (let i = 0; i <= steps; i += 1) {
          const angle = (i / steps) * Math.PI * 2;
          const dx = (radiusM * Math.cos(angle)) / (111320 * Math.cos((lat * Math.PI) / 180));
          const dy = (radiusM * Math.sin(angle)) / 110540;
          coords.push([lng + dx, lat + dy]);
        }
        return { type: "Polygon", coordinates: [coords] };
      }

      function setLapMarker(marker) {
        state.lapMarker = marker || null;
        const src = map.getSource("lapZone");
        if (!src) return;
        if (!marker || !marker.lat || !marker.lng) {
          src.setData({ type: "FeatureCollection", features: [] });
          return;
        }
        src.setData({
          type: "FeatureCollection",
          features: [
            {
              type: "Feature",
              geometry: circlePolygon(marker.lng, marker.lat, marker.radiusMeters || 22),
              properties: {}
            },
            {
              type: "Feature",
              geometry: { type: "Point", coordinates: [marker.lng, marker.lat] },
              properties: {}
            }
          ]
        });
      }

      function setLaps(laps) {
        state.laps = laps || [];
        const src = map.getSource("laps");
        if (!src) return;
        src.setData({
          type: "FeatureCollection",
          features: (laps || []).map((lap, index) => ({
            type: "Feature",
            geometry: { type: "Point", coordinates: [lap.lng, lap.lat] },
            properties: { n: index + 1 }
          }))
        });
      }

      function setPickMode(on) {
        state.pickMode = Boolean(on);
        document.getElementById("map").classList.toggle("is-picking", state.pickMode);
        document.getElementById("pickBanner").classList.toggle("is-on", state.pickMode);
        map.getCanvas().style.cursor = state.pickMode ? "crosshair" : "";
      }

      function layerCount() {
        const l = state.layers;
        return ["pois", "bikeLanes", "avalanche", "slope", "aspect"].filter((k) => l[k]).length + 1;
      }

      window.applyMapCommand = function applyMapCommand(raw) {
        const msg = typeof raw === "string" ? JSON.parse(raw) : raw;
        if (!msg || !msg.type) return;
        if (msg.type === "init" || msg.type === "setView") {
          if (msg.lat && msg.lng) map.jumpTo({ center: [msg.lng, msg.lat], zoom: msg.zoom || 15 });
        }
        if (msg.type === "setTrack") setTrack(msg.points || []);
        if (msg.type === "setHeat") setHeat(msg.tracks || [], msg.cells || []);
        if (msg.type === "setLive" && msg.lat && msg.lng) setLive(msg.lat, msg.lng);
        if (msg.type === "setMapType") {
          state.mapType = msg.mapType || "standard";
          refreshStyle();
        }
        if (msg.type === "setActivityMap") {
          state.activityMap = msg.mode || "personal";
          refreshStyle();
        }
        if (msg.type === "setLayers") {
          state.layers = Object.assign(state.layers, msg.layers || {});
          document.getElementById("layerBadge").textContent = String(layerCount());
          refreshStyle();
        }
        if (msg.type === "set3d") {
          state.is3d = Boolean(msg.on);
          apply3d();
        }
        if (msg.type === "showControls") {
          document.getElementById("fabs").style.display = msg.on === false ? "none" : "grid";
        }
        if (msg.type === "locate") emit({ type: "locate-request" });
        if (msg.type === "setLapMarker") setLapMarker(msg.marker || null);
        if (msg.type === "setLaps") setLaps(msg.laps || []);
        if (msg.type === "setPickMode") setPickMode(msg.on);
      };

      function onMsg(ev) {
        const data = ev && ev.data;
        if (!data) return;
        try {
          window.applyMapCommand(typeof data === "string" && data[0] === "{" ? JSON.parse(data) : data);
        } catch (e) {}
      }
      window.addEventListener("message", onMsg);
      document.addEventListener("message", onMsg);

      document.getElementById("layersBtn").onclick = () => emit({ type: "open-layers" });
      document.getElementById("btn3d").onclick = () => {
        state.is3d = !state.is3d;
        apply3d();
        emit({ type: "toggle-3d", on: state.is3d });
      };
      document.getElementById("locateBtn").onclick = () => emit({ type: "locate-request" });

      map.on("click", (event) => {
        if (!state.pickMode) return;
        const { lng, lat } = event.lngLat;
        emit({ type: "map-pick", kind: "lap-start", lat, lng });
        setPickMode(false);
      });

      map.on("load", () => emit({ type: "ready" }));
    </script>
  </body>
</html>
