<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Mapa de atividade</title>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.28.1/mapbox-gl.css" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; width: 100%; background: #0b1a12; overflow: hidden; }
      #map { position: absolute; inset: 0; }
      .fab-stack {
        position: absolute;
        right: 12px;
        bottom: clamp(220px, 34vh, 380px);
        display: grid;
        gap: 10px;
        z-index: 8;
        transition: bottom 180ms ease;
        pointer-events: auto;
      }
      .fab, .fab-3d {
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 50%;
        background: rgba(255,255,255,.86);
        color: #15100b;
        box-shadow: 0 8px 18px rgba(0,0,0,.28);
        font-weight: 800;
        cursor: pointer;
        position: relative;
        backdrop-filter: blur(10px);
      }
      .fab-3d { font-size: 12px; letter-spacing: .04em; }
      .fab.active, .fab-3d.active { background: #f2b461; color: #1a1208; }
      .badge {
        position: absolute;
        top: -4px;
        right: -4px;
        min-width: 18px;
        height: 18px;
        border-radius: 999px;
        background: #df663c;
        color: #fff;
        font-size: 10px;
        font-weight: 800;
        display: none;
        place-items: center;
        padding: 0 4px;
      }
      .badge.is-on { display: grid; }
      #map.is-picking { cursor: crosshair; }
      .pick-banner {
        display: none;
        position: absolute;
        left: 12px;
        right: 68px;
        top: 12px;
        z-index: 5;
        background: rgba(21, 16, 11, 0.92);
        color: #fff;
        border-radius: 14px;
        padding: 10px 12px;
        font: 700 13px/1.35 system-ui, sans-serif;
        box-shadow: 0 10px 24px rgba(0,0,0,.28);
      }
      .pick-banner.is-on { display: block; }
      .map-error {
        display: none;
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 12px;
        z-index: 6;
        background: rgba(120, 24, 24, 0.92);
        color: #fff;
        border-radius: 12px;
        padding: 10px 12px;
        font: 600 12px/1.4 system-ui, sans-serif;
      }
      .map-error.is-on { display: block; }
      .live-dot, .lap-dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 3px solid #fff;
        box-sizing: border-box;
        box-shadow: 0 1px 4px rgba(0,0,0,.35);
      }
      .live-dot { background: #2f7dff; }
      .live-pin {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #2f7dff;
        border: 2px solid #fff;
        box-sizing: border-box;
        box-shadow: 0 2px 6px rgba(0,0,0,.4);
        display: grid;
        place-items: center;
        pointer-events: none;
        color: #fff;
      }
      .live-pin svg {
        width: 18px;
        height: 18px;
        display: block;
      }
      .live-pin .live-icon {
        width: 18px;
        height: 18px;
        background: #fff;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
      }
      .lap-dot { background: #df663c; width: 18px; height: 18px; }
      .lap-num {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #f2b461;
        color: #1a1208;
        font: 700 11px/18px system-ui, sans-serif;
        text-align: center;
        border: 2px solid #fff;
        box-sizing: border-box;
      }
      .mapboxgl-ctrl-logo { margin: 0 8px 8px; }
      .mapboxgl-canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div class="pick-banner" id="pickBanner">Toque no mapa para marcar o ponto de partida da volta</div>
    <div class="map-error" id="mapError"></div>
    <div class="fab-stack" id="fabs">
      <button class="fab" id="layersBtn" type="button" title="Camadas" aria-label="Camadas">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
        <span class="badge" id="layerBadge">0</span>
      </button>
      <button class="fab-3d" id="btn3d" type="button" aria-label="Mapa 3D">3D</button>
      <button class="fab" id="locateBtn" type="button" title="Minha localização" aria-label="Centralizar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
    </div>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.28.1/mapbox-gl.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      function readParentToken() {
        try {
          if (window.parent && window.parent !== window) {
            return window.parent.__MAPBOX_ACCESS_TOKEN__ || "";
          }
        } catch (e) {}
        return "";
      }
      let MAPBOX_TOKEN = params.get("mb") || readParentToken();
      let mapsBooted = false;
      let currentStyle = "";

      const LAST_GPS_KEY = "apptreino.lastGps";
      const LAST_GPS_MAX_AGE_MS = 30 * 60 * 1000;

      function readCachedCenter() {
        try {
          const raw = sessionStorage.getItem(LAST_GPS_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          const lat = Number(parsed.lat);
          const lng = Number(parsed.lng);
          const t = Number(parsed.t);
          if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
          if (Number.isFinite(t) && Date.now() - t > LAST_GPS_MAX_AGE_MS) return null;
          return [lng, lat];
        } catch (e) {
          return null;
        }
      }

      function persistCachedCenter(lat, lng) {
        try {
          sessionStorage.setItem(LAST_GPS_KEY, JSON.stringify({ lat: lat, lng: lng, t: Date.now() }));
        } catch (e) {}
      }

      const state = {
        mapType: "hybrid",
        activityMap: "personal",
        layers: { pois: true, bikeLanes: false, avalanche: false, slope: false, aspect: false },
        is3d: false,
        follow: true,
        pickMode: false,
        track: [],
        heatTracks: [],
        heatCells: [],
        live: null,
        sport: "RUN",
        gender: "MALE",
        lapMarker: null,
        laps: [],
        userInteracting: false
      };

      let map = null;
      let liveMarker = null;
      let lapStartMarker = null;
      let lapMarkers = [];
      let readyEmitted = false;

      function emptyFc() {
        return { type: "FeatureCollection", features: [] };
      }

      function toLngLat(p) {
        return [Number(p.lng), Number(p.lat)];
      }

      function validLngLat(pair) {
        return Number.isFinite(pair[0]) && Number.isFinite(pair[1]);
      }

      function lineCollection(points) {
        const coords = (points || []).map(toLngLat).filter(validLngLat);
        if (coords.length < 2) return emptyFc();
        return {
          type: "FeatureCollection",
          features: [{ type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: coords } }]
        };
      }

      function multiLineCollection(tracks) {
        const features = (tracks || [])
          .map((track) => (track || []).map(toLngLat).filter(validLngLat))
          .filter((coords) => coords.length > 1)
          .map((coordinates) => ({
            type: "Feature",
            properties: {},
            geometry: { type: "LineString", coordinates }
          }));
        return { type: "FeatureCollection", features };
      }

      function heatCellCollection(cells) {
        const features = (cells || [])
          .filter((c) => c && Number.isFinite(c.lat) && Number.isFinite(c.lng))
          .map((c) => ({
            type: "Feature",
            properties: { weight: Number(c.weight) || 1 },
            geometry: { type: "Point", coordinates: [c.lng, c.lat] }
          }));
        return { type: "FeatureCollection", features };
      }

      function circlePolygon(lng, lat, radiusMeters, steps) {
        const n = steps || 64;
        const coords = [];
        const dLat = radiusMeters / 110540;
        const dLng = radiusMeters / (111320 * Math.cos((lat * Math.PI) / 180) || 1);
        for (let i = 0; i <= n; i++) {
          const a = (i / n) * Math.PI * 2;
          coords.push([lng + dLng * Math.sin(a), lat + dLat * Math.cos(a)]);
        }
        return {
          type: "FeatureCollection",
          features: [{ type: "Feature", properties: {}, geometry: { type: "Polygon", coordinates: [coords] } }]
        };
      }

      function showError(msg) {
        const el = document.getElementById("mapError");
        if (!msg) {
          el.classList.remove("is-on");
          el.textContent = "";
          return;
        }
        el.textContent = msg;
        el.classList.add("is-on");
      }

      function emit(msg) {
        try {
          if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(msg));
          else if (window.parent && window.parent !== window) window.parent.postMessage(msg, "*");
        } catch (e) {}
      }

      function isStandardStyle(url) {
        return /mapbox:\/\/styles\/mapbox\/standard/.test(url);
      }

      function lightPreset() {
        if (state.activityMap === "night") return "night";
        if (state.mapType === "winter") return "dawn";
        const hour = new Date().getHours();
        if (hour < 6 || hour >= 19) return "night";
        if (hour < 8) return "dawn";
        if (hour >= 17) return "dusk";
        return "day";
      }

      function resolveStyle() {
        if (state.mapType === "satellite" || state.mapType === "hybrid") {
          return "mapbox://styles/mapbox/standard-satellite";
        }
        return "mapbox://styles/mapbox/standard";
      }

      function cameraPitch() {
        return state.is3d ? 56 : 0;
      }

      function cameraBearing() {
        return state.is3d ? -16 : 0;
      }

      function basemapConfig() {
        if (!isStandardStyle(resolveStyle())) return undefined;
        const satellite = state.mapType === "satellite" || state.mapType === "hybrid";
        return {
          basemap: {
            lightPreset: lightPreset(),
            showPointOfInterestLabels: state.mapType !== "satellite" && state.layers.pois !== false,
            showPlaceLabels: state.mapType !== "satellite",
            showRoadLabels: state.mapType !== "satellite",
            showTransitLabels: false,
            showPedestrianRoads: true,
            show3dObjects: !satellite
          }
        };
      }

      function applyLanguage() {
        if (!map) return;
        try {
          if (typeof map.setLanguage === "function") map.setLanguage("pt");
        } catch (e) {}
        try {
          map.setConfigProperty("basemap", "language", "pt");
        } catch (e) {}
      }

      function applyBasemapConfig() {
        if (!map) return;
        try {
          if (isStandardStyle(currentStyle)) {
            const cfg = basemapConfig();
            if (cfg && cfg.basemap) {
              Object.keys(cfg.basemap).forEach(function (key) {
                try {
                  map.setConfigProperty("basemap", key, cfg.basemap[key]);
                } catch (err) {}
              });
            }
            applyLanguage();
            return;
          }
        } catch (e) {}
        const vis = state.layers.pois ? "visible" : "none";
        const style = map.getStyle();
        (style && style.layers ? style.layers : []).forEach((layer) => {
          if (/poi/i.test(layer.id)) {
            try {
              map.setLayoutProperty(layer.id, "visibility", vis);
            } catch (err) {}
          }
        });
      }

      function ensureTerrain() {
        if (!map || !map.isStyleLoaded()) return;
        try {
          if (!map.getSource("mapbox-dem")) {
            map.addSource("mapbox-dem", {
              type: "raster-dem",
              url: "mapbox://mapbox.mapbox-terrain-dem-v1",
              tileSize: 512,
              maxzoom: 14
            });
          }
          map.setTerrain({ source: "mapbox-dem", exaggeration: state.is3d ? 1.35 : 0.85 });
        } catch (e) {}
        try {
          const night = lightPreset() === "night";
          map.setFog({
            range: [0.5, 10],
            color: night ? "#101826" : "#e8f0f7",
            "horizon-blend": 0.06,
            "high-color": night ? "#1a2740" : "#9ec3e6",
            "space-color": night ? "#070b12" : "#d7e6f4",
            "star-intensity": night ? 0.35 : 0
          });
        } catch (e) {}
      }

      function applyCamera3d() {
        document.getElementById("btn3d").classList.toggle("active", state.is3d);
        if (!map || !map.isStyleLoaded()) return;
        ensureTerrain();
        try {
          map.easeTo({
            pitch: cameraPitch(),
            bearing: cameraBearing(),
            duration: 500
          });
        } catch (e) {}
      }

      function ensureSource(id, spec) {
        if (!map.getSource(id)) map.addSource(id, spec);
      }

      function ensureLayer(layer, beforeId) {
        if (map.getLayer(layer.id)) return;
        if (beforeId && map.getLayer(beforeId)) map.addLayer(layer, beforeId);
        else map.addLayer(layer);
      }

      function ensureCustomLayers() {
        if (!map) return;
        const night = state.activityMap === "night";
        ensureSource("heat-lines", { type: "geojson", data: emptyFc() });
        ensureSource("heat-cells", { type: "geojson", data: emptyFc() });
        ensureSource("track", { type: "geojson", data: emptyFc() });
        ensureSource("lap-area", { type: "geojson", data: emptyFc() });

        ensureLayer({
          id: "heat-lines-layer",
          type: "line",
          source: "heat-lines",
          layout: { "line-cap": "round", "line-join": "round" },
          paint: {
            "line-color": night ? "#7ee0ff" : "#3d9bff",
            "line-opacity": 0.5,
            "line-blur": 0.4,
            "line-width": ["interpolate", ["linear"], ["zoom"], 12, 2, 16, 3.5, 20, 6]
          }
        });
        ensureLayer({
          id: "heat-cells-layer",
          type: "circle",
          source: "heat-cells",
          paint: {
            "circle-color": night ? "#7ee0ff" : "#ff7a3d",
            "circle-opacity": 0.22,
            "circle-radius": [
              "interpolate",
              ["linear"],
              ["coalesce", ["get", "weight"], 1],
              1,
              18,
              50,
              48,
              200,
              90
            ]
          }
        });
        ensureLayer({
          id: "track-case",
          type: "line",
          source: "track",
          layout: { "line-cap": "round", "line-join": "round" },
          paint: {
            "line-color": "#ffffff",
            "line-opacity": 0.95,
            "line-width": ["interpolate", ["linear"], ["zoom"], 12, 6, 16, 10, 20, 14]
          }
        });
        ensureLayer({
          id: "track-glow",
          type: "line",
          source: "track",
          layout: { "line-cap": "round", "line-join": "round" },
          paint: {
            "line-color": "#2f7dff",
            "line-opacity": 0.5,
            "line-blur": 0.8,
            "line-width": ["interpolate", ["linear"], ["zoom"], 12, 7, 16, 13, 20, 18]
          }
        });
        ensureLayer({
          id: "track-line",
          type: "line",
          source: "track",
          layout: { "line-cap": "round", "line-join": "round" },
          paint: {
            "line-color": "#2f7dff",
            "line-opacity": 1,
            "line-width": ["interpolate", ["linear"], ["zoom"], 12, 4, 16, 6.5, 20, 10]
          }
        });
        ensureLayer({
          id: "lap-fill",
          type: "fill",
          source: "lap-area",
          paint: { "fill-color": "#df663c", "fill-opacity": 0.18 }
        });
        ensureLayer({
          id: "lap-stroke",
          type: "line",
          source: "lap-area",
          paint: { "line-color": "#df663c", "line-width": 2, "line-opacity": 0.9 }
        });

        if (map.getLayer("heat-lines-layer")) {
          map.setPaintProperty("heat-lines-layer", "line-color", night ? "#7ee0ff" : "#3d9bff");
          map.setPaintProperty("heat-cells-layer", "circle-color", night ? "#7ee0ff" : "#ff7a3d");
        }
        paintTrackLine();
      }

      function paintTrackLine() {
        if (!map) return;
        if (map.getLayer("track-case")) {
          map.setPaintProperty("track-case", "line-color", "#ffffff");
          map.setPaintProperty("track-case", "line-opacity", 0.95);
        }
        if (map.getLayer("track-glow")) {
          map.setPaintProperty("track-glow", "line-color", "#2f7dff");
          map.setPaintProperty("track-glow", "line-opacity", 0.5);
        }
        if (map.getLayer("track-line")) {
          map.setPaintProperty("track-line", "line-color", "#2f7dff");
          map.setPaintProperty("track-line", "line-opacity", 1);
        }
        ["track-case", "track-glow", "track-line"].forEach(function (id) {
          try {
            if (map.getLayer(id)) map.setPaintProperty(id, "line-emissive-strength", 1);
          } catch (e) {}
        });
      }

      function applyMapboxOverlays() {
        if (!map || !map.isStyleLoaded()) return;
        ["overlay-bike", "overlay-hillshade"].forEach(function (id) {
          if (map.getLayer(id)) map.removeLayer(id);
        });
        const before = map.getLayer("heat-lines-layer") ? "heat-lines-layer" : undefined;
        const wantTerrainOverlay = state.layers.slope || state.layers.avalanche || state.layers.aspect;
        if (wantTerrainOverlay) {
          ensureTerrain();
          const hill = {
            id: "overlay-hillshade",
            type: "hillshade",
            source: "mapbox-dem",
            paint: {
              "hillshade-exaggeration": state.layers.avalanche ? 0.85 : 0.55,
              "hillshade-illumination-direction": state.layers.aspect ? 315 : 335,
              "hillshade-shadow-color": "#2a2118",
              "hillshade-highlight-color": "#fff6e8"
            }
          };
          if (before) map.addLayer(hill, before);
          else map.addLayer(hill);
        }
        if (state.layers.bikeLanes) {
          if (!map.getSource("mapbox-streets")) {
            map.addSource("mapbox-streets", {
              type: "vector",
              url: "mapbox://mapbox.mapbox-streets-v8"
            });
          }
          const bike = {
            id: "overlay-bike",
            type: "line",
            source: "mapbox-streets",
            "source-layer": "road",
            filter: [
              "any",
              ["==", ["get", "class"], "cycleway"],
              ["==", ["get", "type"], "cycleway"],
              ["==", ["get", "class"], "path"]
            ],
            layout: { "line-cap": "round", "line-join": "round" },
            paint: {
              "line-color": "#14b8a6",
              "line-opacity": 0.9,
              "line-width": ["interpolate", ["linear"], ["zoom"], 12, 1.5, 16, 3, 20, 5]
            }
          };
          if (before) map.addLayer(bike, before);
          else map.addLayer(bike);
        }
      }

      function applyBaseAppearance() {
        if (!map) return;
        const next = resolveStyle();
        if (next !== currentStyle) {
          currentStyle = next;
          const config = basemapConfig();
          map.setStyle(next, config ? { config: config } : undefined);
          return;
        }
        applyBasemapConfig();
        applyCamera3d();
        applyMapboxOverlays();
        updateLayerBadge();
      }

      function setData(sourceId, data) {
        const src = map && map.getSource(sourceId);
        if (src) src.setData(data);
      }

      function setTrack(points, fit) {
        state.track = points || [];
        setData("track", lineCollection(state.track));
        paintTrackLine();
        const coords = state.track.map(toLngLat).filter(validLngLat);
        if (fit && coords.length > 1 && map) {
          const bounds = coords.reduce(function (b, c) {
            return b.extend(c);
          }, new mapboxgl.LngLatBounds(coords[0], coords[0]));
          map.fitBounds(bounds, {
            padding: 48,
            duration: 400,
            pitch: cameraPitch(),
            bearing: cameraBearing()
          });
        }
      }

      function setHeat(tracks, cells) {
        state.heatTracks = tracks || [];
        state.heatCells = cells || [];
        setData("heat-lines", multiLineCollection(state.heatTracks));
        setData("heat-cells", heatCellCollection(state.heatCells));
      }

      function makeDot(className) {
        const el = document.createElement("div");
        el.className = className;
        return el;
      }

      function sportIconHtml(sport, gender) {
        const kind = String(sport || "RUN").toUpperCase();
        if (kind === "RIDE") {
          return '<span class="live-icon" style="-webkit-mask-image:url(/assets/ciclismo-mask.svg?v=1);mask-image:url(/assets/ciclismo-mask.svg?v=1)"></span>';
        }
        if (kind === "WALK") {
          return '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/><path d="M16 17h4"/><path d="M4 13h4"/></svg>';
        }
        const src = gender === "FEMALE" ? "/assets/corrida-mulher-mask.png" : "/assets/corrida-homem-mask.png";
        return '<span class="live-icon" style="-webkit-mask-image:url(' + src + ');mask-image:url(' + src + ')"></span>';
      }

      function makeLivePin() {
        const el = document.createElement("div");
        el.className = "live-pin";
        el.innerHTML = sportIconHtml(state.sport, state.gender);
        return el;
      }

      function updateLivePin(el) {
        if (!el) return;
        el.className = "live-pin";
        el.innerHTML = sportIconHtml(state.sport, state.gender);
      }

      function applySport(sport, gender) {
        if (sport) state.sport = String(sport).toUpperCase();
        if (gender) state.gender = gender === "FEMALE" ? "FEMALE" : "MALE";
        if (liveMarker && liveMarker.getElement) {
          updateLivePin(liveMarker.getElement());
          return;
        }
        if (!map) return;
        const pos = state.live || { lat: map.getCenter().lat, lng: map.getCenter().lng };
        if (!Number.isFinite(pos.lat) || !Number.isFinite(pos.lng)) return;
        liveMarker = new mapboxgl.Marker({ element: makeLivePin(), anchor: "center" }).setLngLat([pos.lng, pos.lat]).addTo(map);
      }

      function setLive(lat, lng, follow, sport, gender) {
        state.live = { lat: lat, lng: lng };
        persistCachedCenter(lat, lng);
        applySport(sport, gender);
        if (!map) return;
        if (!liveMarker) {
          liveMarker = new mapboxgl.Marker({ element: makeLivePin(), anchor: "center" }).setLngLat([lng, lat]).addTo(map);
        } else {
          liveMarker.setLngLat([lng, lat]);
          updateLivePin(liveMarker.getElement());
        }
        if (follow) {
          state.follow = true;
          state.userInteracting = false;
        }
        const shouldFollow = follow !== false && state.follow && !state.userInteracting;
        if (shouldFollow) {
          const zoom = map.getZoom();
          map.easeTo({
            center: [lng, lat],
            zoom: zoom < 16.5 ? 18 : zoom,
            duration: 400,
            pitch: cameraPitch(),
            bearing: state.is3d ? map.getBearing() : 0
          });
        }
      }

      function setLapMarker(marker) {
        state.lapMarker = marker || null;
        if (lapStartMarker) {
          lapStartMarker.remove();
          lapStartMarker = null;
        }
        if (!marker || !Number.isFinite(marker.lat) || !Number.isFinite(marker.lng)) {
          setData("lap-area", emptyFc());
          return;
        }
        setData("lap-area", circlePolygon(marker.lng, marker.lat, marker.radiusMeters || 22));
        if (map) {
          lapStartMarker = new mapboxgl.Marker({ element: makeDot("lap-dot") })
            .setLngLat([marker.lng, marker.lat])
            .addTo(map);
        }
      }

      function clearLapMarkers() {
        lapMarkers.forEach(function (m) {
          m.remove();
        });
        lapMarkers = [];
      }

      function setLaps(laps) {
        state.laps = laps || [];
        clearLapMarkers();
        if (!map) return;
        state.laps.forEach(function (lap, index) {
          if (!Number.isFinite(lap.lat) || !Number.isFinite(lap.lng)) return;
          const el = document.createElement("div");
          el.className = "lap-num";
          el.textContent = String(index + 1);
          lapMarkers.push(new mapboxgl.Marker({ element: el }).setLngLat([lap.lng, lap.lat]).addTo(map));
        });
      }

      function setPickMode(on) {
        state.pickMode = Boolean(on);
        document.getElementById("map").classList.toggle("is-picking", state.pickMode);
        const nested = window.parent && window.parent !== window;
        document.getElementById("pickBanner").classList.toggle("is-on", state.pickMode && !nested);
      }

      function extraLayerCount() {
        const l = state.layers;
        return ["bikeLanes", "avalanche", "slope", "aspect"].filter(function (k) {
          return l[k];
        }).length;
      }

      function updateLayerBadge() {
        const n = extraLayerCount();
        const badge = document.getElementById("layerBadge");
        badge.textContent = String(n);
        badge.classList.toggle("is-on", n > 0);
      }

      function restoreOverlays() {
        setTrack(state.track, false);
        setHeat(state.heatTracks, state.heatCells);
        if (state.live) setLive(state.live.lat, state.live.lng, false);
        setLapMarker(state.lapMarker);
        setLaps(state.laps);
      }

      function onStyleReady() {
        try {
          map.resize();
        } catch (e) {}
        applyLanguage();
        ensureCustomLayers();
        applyBasemapConfig();
        applyMapboxOverlays();
        restoreOverlays();
        applyCamera3d();
        updateLayerBadge();
        if (!readyEmitted) {
          readyEmitted = true;
          emit({ type: "ready" });
        }
        showError("");
      }

      window.applyMapCommand = function applyMapCommand(raw) {
        const msg = typeof raw === "string" ? JSON.parse(raw) : raw;
        if (!msg || !msg.type) return;
        if (msg.type === "setMapsConfig") {
          bootMapbox(msg.mapboxToken || msg.token || MAPBOX_TOKEN);
          return;
        }
        if (msg.type === "setChromeInset") {
          const bottom = Math.max(16, Number(msg.bottom) || 16);
          document.getElementById("fabs").style.bottom = bottom + "px";
          const attr = document.querySelector(".mapboxgl-ctrl-bottom-left");
          if (attr) attr.style.bottom = Math.max(8, bottom - 8) + "px";
        }
        if (msg.type === "showControls") {
          document.getElementById("fabs").style.display = msg.on === false ? "none" : "grid";
        }
        if (msg.type === "setSport") {
          applySport(msg.sport, msg.gender);
        }
        if (!map) return;
        if (msg.type === "init" || msg.type === "setView") {
          const lat = Number(msg.lat);
          const lng = Number(msg.lng);
          if (Number.isFinite(lat) && Number.isFinite(lng)) {
            state.userInteracting = false;
            map.jumpTo({
              center: [lng, lat],
              zoom: msg.zoom || 18,
              pitch: cameraPitch(),
              bearing: cameraBearing()
            });
          }
        }
        if (msg.type === "setFollow") {
          state.follow = msg.on !== false;
          if (state.follow) state.userInteracting = false;
        }
        if (msg.type === "setTrack") setTrack(msg.points || [], Boolean(msg.fit));
        if (msg.type === "setHeat") setHeat(msg.tracks || [], msg.cells || []);
        if (msg.type === "resize") {
          try { map.resize(); } catch (e) {}
        }
        if (msg.type === "setLive" && Number.isFinite(Number(msg.lat)) && Number.isFinite(Number(msg.lng))) {
          setLive(Number(msg.lat), Number(msg.lng), msg.follow, msg.sport, msg.gender);
        }
        if (msg.type === "setMapType") {
          state.mapType = msg.mapType || "hybrid";
          applyBaseAppearance();
        }
        if (msg.type === "setActivityMap") {
          state.activityMap = msg.mode || "personal";
          applyBaseAppearance();
        }
        if (msg.type === "setLayers") {
          state.layers = Object.assign(state.layers, msg.layers || {});
          applyBasemapConfig();
          applyMapboxOverlays();
          updateLayerBadge();
        }
        if (msg.type === "set3d") {
          state.is3d = Boolean(msg.on);
          applyCamera3d();
        }
        if (msg.type === "showControls") {
          document.getElementById("fabs").style.display = msg.on === false ? "none" : "grid";
        }
        if (msg.type === "locate") emit({ type: "locate-request" });
        if (msg.type === "setLapMarker") setLapMarker(msg.marker || null);
        if (msg.type === "setLaps") setLaps(msg.laps || []);
        if (msg.type === "setPickMode") setPickMode(msg.on);
      };

      function onMsg(ev) {
        const data = ev && ev.data;
        if (!data) return;
        try {
          window.applyMapCommand(typeof data === "string" && data[0] === "{" ? JSON.parse(data) : data);
        } catch (e) {}
      }
      window.addEventListener("message", onMsg);
      document.addEventListener("message", onMsg);

      document.getElementById("layersBtn").onclick = function () {
        emit({ type: "open-layers" });
      };
      document.getElementById("btn3d").onclick = function () {
        state.is3d = !state.is3d;
        applyCamera3d();
        emit({ type: "toggle-3d", on: state.is3d });
      };
      document.getElementById("locateBtn").onclick = function () {
        state.follow = true;
        state.userInteracting = false;
        emit({ type: "locate-request" });
        bootUserLocation(true);
      };

      function bootUserLocation(highAccuracy) {
        if (!navigator.geolocation) {
          emit({ type: "geo-error", reason: "unsupported" });
          return;
        }
        navigator.geolocation.getCurrentPosition(
          function (pos) {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            persistCachedCenter(lat, lng);
            state.follow = true;
            state.userInteracting = false;
            setLive(lat, lng, true);
            try {
              map.jumpTo({
                center: [lng, lat],
                zoom: 18,
                pitch: cameraPitch(),
                bearing: cameraBearing()
              });
            } catch (e) {}
          },
          function (err) {
            if (highAccuracy) {
              emit({ type: "geo-error", reason: err && err.code === 1 ? "denied" : "unavailable" });
              return;
            }
            bootUserLocation(true);
          },
          highAccuracy
            ? { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            : { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
        );
      }

      function initMap() {
        if (typeof mapboxgl === "undefined") {
          showError("Mapbox GL JS não carregou. Verifique a rede.");
          return;
        }
        if (!mapboxgl.supported()) {
          showError("Este navegador não suporta Mapbox GL JS.");
          return;
        }
        mapboxgl.accessToken = MAPBOX_TOKEN;
        currentStyle = resolveStyle();
        const config = basemapConfig();
        const cachedCenter = readCachedCenter();
        map = new mapboxgl.Map({
          container: "map",
          style: currentStyle,
          center: cachedCenter || [-46.63, -23.55],
          zoom: cachedCenter ? 17.6 : 16.8,
          minZoom: 2,
          maxZoom: 20,
          pitch: 0,
          bearing: 0,
          antialias: true,
          maxPitch: 85,
          pixelRatio: Math.max(window.devicePixelRatio || 1, 2),
          fadeDuration: 280,
          attributionControl: false,
          failIfMajorPerformanceCaveat: false,
          config: config
        });
        map.addControl(new mapboxgl.AttributionControl({ compact: true }), "bottom-left");
        map.on("style.load", onStyleReady);
        map.on("error", function (e) {
          const message = (e && e.error && e.error.message) || "";
          if (/access token|unauthorized|401|403|not authorized/i.test(message)) {
            showError("Token Mapbox inválido. Configure VITE_MAPBOX_ACCESS_TOKEN (token público pk.).");
          }
        });
        map.on("dragstart", function () {
          state.userInteracting = true;
          emit({ type: "user-pan" });
        });
        map.on("click", function (event) {
          if (!state.pickMode || !event.lngLat) return;
          emit({ type: "map-pick", kind: "lap-start", lat: event.lngLat.lat, lng: event.lngLat.lng });
          setPickMode(false);
        });
        window.addEventListener("resize", function () {
          try {
            map.resize();
          } catch (e) {}
        });
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", function () {
            try {
              map.resize();
            } catch (e) {}
          });
        }
        if (typeof ResizeObserver !== "undefined") {
          new ResizeObserver(function () {
            try {
              map.resize();
            } catch (e) {}
          }).observe(document.getElementById("map"));
        }
        if (cachedCenter) setLive(cachedCenter[1], cachedCenter[0], false);
        bootUserLocation(true);
      }

      function bootMapbox(token) {
        if (mapsBooted) return;
        if (token) MAPBOX_TOKEN = String(token);
        if (!MAPBOX_TOKEN) {
          showError("Configure VITE_MAPBOX_ACCESS_TOKEN no .env (token público pk. em account.mapbox.com).");
          return;
        }
        mapsBooted = true;
        showError("");
        try {
          initMap();
        } catch (err) {
          mapsBooted = false;
          showError(err && err.message ? err.message : "Falha ao iniciar o Mapbox.");
        }
      }

      MAPBOX_TOKEN = MAPBOX_TOKEN || readParentToken();
      if (MAPBOX_TOKEN) {
        bootMapbox(MAPBOX_TOKEN);
      } else {
        setTimeout(function () {
          MAPBOX_TOKEN = MAPBOX_TOKEN || readParentToken();
          bootMapbox(MAPBOX_TOKEN);
        }, 120);
      }
    </script>
  </body>
</html>
