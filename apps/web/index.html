<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <style id="atlly-student-nav-critical">
      html.is-ios-pwa {
        background-color: #05070c;
      }
      html.light.is-ios-pwa {
        background-color: #ffffff;
      }
      html.is-ios-pwa body::after {
        content: "";
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(-1 * var(--ios-layout-viewport-gap, 0px));
        height: max(
          env(safe-area-inset-bottom, constant(safe-area-inset-bottom, 0px)),
          var(--ios-viewport-bottom-fill, 0px)
        );
        background: #05070c;
        z-index: 119;
        pointer-events: none;
      }
      html.light.is-ios-pwa body::after {
        background: #ffffff;
      }
      html.is-ios-pwa.has-portal-bottom-nav body::after,
      html.is-ios-pwa.has-student-nav-pinned body::after {
        display: none;
      }
      #atlly-student-nav-root {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 120;
        width: 100%;
        margin: 0;
        padding-bottom: 0;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        background: #0b101c;
        pointer-events: none;
      }
      html.light #atlly-student-nav-root,
      html.light #atlly-student-nav-root > .student-bottom-nav {
        background: #ffffff;
      }
      #atlly-student-nav-root:empty {
        display: none;
      }
      #atlly-student-nav-root > .student-bottom-nav,
      nav.student-bottom-nav.student-bottom-nav--docked {
        position: relative;
        width: 100%;
        margin: 0;
        min-height: 0;
        height: auto;
        margin-bottom: 0;
        padding: 8px 8px env(safe-area-inset-bottom, 16px);
        box-sizing: border-box;
        pointer-events: auto;
        z-index: 120;
        background: #0b101c;
        border-radius: 0;
        border-top: 1px solid rgba(212, 175, 55, 0.14);
      }
    </style>
    <script>
      (function () {
        var standalone = false;
        try {
          standalone =
            window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
          if (standalone) document.documentElement.classList.add("is-pwa-standalone");
          if (
            /iPhone|iPad|iPod/.test(navigator.userAgent) ||
            (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
          ) {
            document.documentElement.classList.add("is-ios-pwa");
          }
        } catch (e) {}
        function syncSafeArea() {
          var el = document.createElement("div");
          el.setAttribute("aria-hidden", "true");
          el.style.cssText =
            "position:fixed;bottom:0;left:0;right:0;height:0;box-sizing:border-box;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);";
          document.body.appendChild(el);
          var s = getComputedStyle(el);
          var top = parseFloat(s.paddingTop) || 0;
          var right = parseFloat(s.paddingRight) || 0;
          var bottom = parseFloat(s.paddingBottom) || 0;
          var left = parseFloat(s.paddingLeft) || 0;
          el.remove();
          var root = document.documentElement;
          if (top > 0) root.style.setProperty("--expo-safe-top", top + "px");
          else root.style.removeProperty("--expo-safe-top");
          if (right > 0) root.style.setProperty("--expo-safe-right", right + "px");
          else root.style.removeProperty("--expo-safe-right");
          if (bottom > 0) {
            root.style.setProperty("--expo-safe-bottom", bottom + "px");
            root.style.setProperty("--safe-bottom", bottom + "px");
          } else {
            root.style.removeProperty("--expo-safe-bottom");
            root.style.removeProperty("--safe-bottom");
          }
          if (left > 0) root.style.setProperty("--expo-safe-left", left + "px");
          else root.style.removeProperty("--expo-safe-left");
        }
        function syncVh() {
          var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
          document.documentElement.style.setProperty("--app-vh", Math.round(h) + "px");
        }
        function syncIosGap() {
          var appleTouch =
            /iPhone|iPad|iPod/.test(navigator.userAgent) ||
            (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
          if (!appleTouch) return;
          var vv = window.visualViewport;
          var visualBottom = vv ? vv.offsetTop + vv.height : window.innerHeight;
          var layoutGap = Math.max(0, window.innerHeight - visualBottom);
          var root = document.documentElement;
          root.style.setProperty("--ios-layout-viewport-gap", Math.round(layoutGap) + "px");
          var bottom = parseFloat(getComputedStyle(root).getPropertyValue("--expo-safe-bottom")) || 0;
          var fill = Math.max(bottom, layoutGap);
          if (fill > 0) root.style.setProperty("--ios-viewport-bottom-fill", Math.round(fill) + "px");
          else root.style.removeProperty("--ios-viewport-bottom-fill");
          if (bottom > 0) root.style.setProperty("--ios-safe-bottom-pad", Math.round(bottom) + "px");
          else root.style.removeProperty("--ios-safe-bottom-pad");
          root.style.removeProperty("--student-nav-dock-padding-bottom");
        }
        function boot() {
          syncSafeArea();
          syncVh();
          syncIosGap();
        }
        if (document.body) boot();
        else document.addEventListener("DOMContentLoaded", boot);
        window.addEventListener("resize", function () {
          syncSafeArea();
          syncVh();
          syncIosGap();
        });
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", function () {
            syncSafeArea();
            syncVh();
            syncIosGap();
          });
        }
      })();
    </script>
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="description" content="ATLLY — treino, corrida, performance e comunidade de atletas." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <script>
      (function () {
        try {
          var theme = localStorage.getItem("app-treino-theme") === "light" ? "light" : "dark";
          var root = document.documentElement;
          root.classList.toggle("dark", theme === "dark");
          root.classList.toggle("light", theme === "light");
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
