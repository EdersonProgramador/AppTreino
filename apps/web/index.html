<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content"
    />
    <style id="atlly-student-nav-critical">
      #atlly-student-nav-root {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 120;
        width: 100%;
        margin: 0;
        padding: 0 0 env(safe-area-inset-bottom, constant(safe-area-inset-bottom, 0px));
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        background: #0b101c;
        pointer-events: none;
      }
      #atlly-student-nav-root:empty {
        display: none;
      }
      #atlly-student-nav-root > .student-bottom-nav,
      nav.student-bottom-nav.student-bottom-nav--docked {
        position: relative;
        width: 100%;
        margin: 0;
        min-height: 64px;
        padding: 6px 12px 6px;
        box-sizing: border-box;
        pointer-events: auto;
        z-index: 120;
      }
    </style>
    <script>
      (function () {
        var standalone = false;
        try {
          standalone =
            window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
          if (standalone) document.documentElement.classList.add("is-pwa-standalone");
          if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
            document.documentElement.classList.add("is-ios-pwa");
          }
        } catch (e) {}
        function syncSafeArea() {
          var el = document.createElement("div");
          el.setAttribute("aria-hidden", "true");
          el.style.cssText =
            "position:fixed;bottom:0;left:0;right:0;height:0;box-sizing:border-box;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);";
          document.body.appendChild(el);
          var s = getComputedStyle(el);
          var top = parseFloat(s.paddingTop) || 0;
          var right = parseFloat(s.paddingRight) || 0;
          var bottom = parseFloat(s.paddingBottom) || 0;
          var left = parseFloat(s.paddingLeft) || 0;
          el.remove();
          var root = document.documentElement;
          if (top > 0) root.style.setProperty("--expo-safe-top", top + "px");
          else root.style.removeProperty("--expo-safe-top");
          if (right > 0) root.style.setProperty("--expo-safe-right", right + "px");
          else root.style.removeProperty("--expo-safe-right");
          if (bottom > 0) {
            root.style.setProperty("--expo-safe-bottom", bottom + "px");
            root.style.setProperty("--safe-bottom", bottom + "px");
          } else {
            root.style.removeProperty("--expo-safe-bottom");
            root.style.removeProperty("--safe-bottom");
          }
          if (left > 0) root.style.setProperty("--expo-safe-left", left + "px");
          else root.style.removeProperty("--expo-safe-left");
        }
        function syncVh() {
          var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
          document.documentElement.style.setProperty("--app-vh", Math.round(h) + "px");
        }
        syncSafeArea();
        syncVh();
        window.addEventListener("resize", function () {
          syncSafeArea();
          syncVh();
        });
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", function () {
            syncSafeArea();
            syncVh();
          });
        }
      })();
    </script>
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="description" content="ATLLY — treino, corrida, performance e comunidade de atletas." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ATLLY" />
    <link rel="icon" type="image/png" href="assets/atlly-mark.png" />
    <link rel="apple-touch-icon" href="pwa/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Oxanium:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>ATLLY — Human Performance System</title>

    <script>
      (function () {
        try {
          var theme = localStorage.getItem("app-treino-theme") === "light" ? "light" : "dark";
          var root = document.documentElement;
          root.classList.toggle("dark", theme === "dark");
          root.classList.toggle("light", theme === "light");
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
